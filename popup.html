<!DOCTYPE html>
<html lang="it"><head>
    <meta charset="UTF-8">
    <title>Ermes Stralcio Completo</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; width: 620px; padding: 18px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #222; margin: 0; font-size: 13px; }
        .container { background: white; border-radius: 14px; padding: 20px 22px; box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
        h3 { margin: 0 0 16px 0; font-size: 20px; color: #2d6cdf; text-align: center; padding-bottom: 12px; border-bottom: 2px solid #e4e7eb; letter-spacing: 0.3px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .card { background: #f8f9fc; border: 1px solid #e4e7eb; border-radius: 10px; padding: 14px; }
        .section-title { font-size: 12px; font-weight: 700; margin: 0 0 10px 0; color: #444; text-transform: uppercase; letter-spacing: 0.6px; }
        .card .section-title + * { margin-top: 0; }
        .card .section-title.spaced { margin-top: 16px; }
        input, select, button { width: 100%; font-family: inherit; }
        input[type="date"], select { padding: 9px 10px; border-radius: 7px; border: 1px solid #d0d5dd; background: white; font-size: 13px; transition: border-color 0.2s; }
        input[type="date"]:focus, select:focus { outline: none; border-color: #2d6cdf; box-shadow: 0 0 0 3px rgba(45,108,223,0.12); }
        button { padding: 10px; border: none; background: #2d6cdf; color: white; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s; }
        button:hover { background: #1f56b5; transform: translateY(-1px); box-shadow: 0 2px 6px rgba(45, 108, 223, 0.3); }
        button:active { transform: translateY(0); }
        .small-btn { background: white; color: #2d6cdf; border: 1px solid #d6defa; font-size: 12px; padding: 8px 6px; font-weight: 500; }
        .small-btn:hover { background: #e0e7ff; color: #1f56b5; box-shadow: none; }
        .date-row { display: flex; flex-direction: column; gap: 10px; }
        .date-row label { font-size: 12px; color: #666; display: flex; flex-direction: column; gap: 4px; }
        .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .flags { display: flex; gap: 6px; margin-bottom: 10px; }
        .flags label { flex: 1; text-align: center; white-space: nowrap; padding: 8px 2px; border: 1px solid #d0d5dd; border-radius: 7px; font-size: 12px; cursor: pointer; background: white; user-select: none; }
        .flags input { display: none; }
        .flags label:has(input:checked) { background: #2d6cdf; color: white; border-color: #2d6cdf; font-weight: 600; }
        .options { display: flex; gap: 24px; margin-top: 16px; padding: 12px 4px 0; border-top: 1px solid #e4e7eb; font-size: 13px; }
        .options label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .options input[type="checkbox"] { width: auto; margin: 0; cursor: pointer; }
        #go { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin-top: 16px; padding: 13px; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; }
        #go:hover { background: linear-gradient(135deg, #5568d3 0%, #6a3f8f 100%); }
        details.ids { margin-top: 16px; font-size: 12px; border: 1px solid #e4e7eb; border-radius: 10px; padding: 10px 14px; }
        details.ids summary { cursor: pointer; color: #555; font-weight: 600; }
        .id-list { max-height: 220px; overflow-y: auto; margin-top: 10px; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); column-gap: 18px; padding-right: 6px; row-gap: 4px; }
        .id-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
        .id-row span { flex: 1; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .id-row input { width: 64px; flex-shrink: 0; padding: 4px 6px; border: 1px solid #d0d5dd; border-radius: 5px; font-size: 12px; }
        .id-row.missing span { color: #c62828; }
        .hint { font-size: 11px; color: #888; margin-top: 8px; }
        .module-box { margin-top: 14px; background: #fff7ec; border: 1px dashed #f57c00; border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .module-box .module-text { font-size: 13px; color: #444; }
        .module-box .module-text b { display: block; color: #e65100; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .switch { position: relative; width: 42px; height: 22px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; inset: 0; background: #bdbdbd; border-radius: 22px; cursor: pointer; transition: background 0.2s; }
        .slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: white; border-radius: 50%; transition: transform 0.2s; }
        .switch input:checked + .slider { background: #f57c00; }
        .switch input:checked + .slider::before { transform: translateX(20px); }
    </style>
</head>
<body>
    <div class="container">
        <h3>🚁 Ermes Stralcio</h3>

        <div class="grid">
            <div class="card">
                <div class="section-title">📅 Periodo</div>
                <div class="date-row">
                    <label>Dal <input type="date" id="date_from" value="1950-01-01"></label>
                    <label>Al <input type="date" id="date_to" value="2100-12-31"></label>
                </div>
                <div class="presets">
                    <button class="small-btn" id="ultimi30">30 giorni</button>
                    <button class="small-btn" id="ultimi180">180 giorni</button>
                    <button class="small-btn" id="ultimi365">365 giorni</button>
                    <button class="small-btn" id="tutto">Tutto</button>
                    <button class="small-btn" id="mese">Mese corrente</button>
                    <button class="small-btn" id="anno">Anno corrente</button>
                </div>
            </div>

            <div class="card">
                <div class="section-title">👨&zwj;✈️ Pilota</div>
                <div class="flags" id="flags">
                    <label><input type="radio" name="specialita" value="elicottero">🚁 Elicottero</label>
                    <label><input type="radio" name="specialita" value="aereo">✈️ Aereo</label>
                    <label><input type="radio" name="specialita" value="tutti" checked>🌍 Tutti</label>
                </div>
                <select id="pilota"></select>

                <div class="section-title spaced">🛩️ Aeromobile</div>
                <select id="aeromobile">
                    <option value="7">AW139</option>
                    <option value="">Tutti</option>
                    <option value="1">A109</option>
                    <option value="2">AB206</option>
                    <option value="3">P68</option>
                    <option value="4">AB212</option>
                    <option value="5">P180</option>
                    <option value="6">AW109N</option>
                </select>
            </div>
        </div>

        <div class="options">
            <label><input type="checkbox" id="showSummary" checked=""> 📊 Mostra tabella riepilogativa</label>
            <label><input type="checkbox" id="keepOpen"> 📌 Mantieni schede aperte</label>
        </div>

        <button id="go">🚀 Apri Report</button>

        <details class="ids">
            <summary>⚙️ ID Ermes piloti</summary>
            <div class="id-list" id="idList"></div>
            <div class="hint">ID = parametro "pilota" nel link dello Stralcio Completo. I piloti senza ID vengono saltati.</div>
        </details>
    </div>

    <div class="module-box">
        <div class="module-text">
            <b>🧩 Modulo Parti Prime</b>
            Azioni rapide e allegato scansioni
        </div>
        <label class="switch" title="Attiva/disattiva le funzioni Parti Prime">
            <input type="checkbox" id="partiPrimeEnabled">
            <span class="slider"></span>
        </label>
    </div>
    <script src="pilots.js"></script>
    <script src="popup.js"></script>
</body></html>
